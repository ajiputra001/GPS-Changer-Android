name: Android Release

on:
  push:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Ensure Android Keystore Exists
      run: |
        if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
        elif [ ! -f android/app/upload-keystore.jks ]; then
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload \
            -dname "CN=Ajiputra, OU=Dev, O=AjiputraTech, L=City, S=State, C=ID" \
            -storepass android -keypass android
        fi

    - name: Compute Release Tag
      id: tag
      run: echo "name=release-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Stamp Build Tag Into Source
      run: |
        sed -i "s|static const String buildTag = 'LOCAL_DEV';|static const String buildTag = '${{ steps.tag.outputs.name }}';|g" lib/services/update_service.dart
        echo "Stamped buildTag = '${{ steps.tag.outputs.name }}'"
        grep buildTag lib/services/update_service.dart

    - name: Build Android Universal APK
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
      run: |
        flutter pub get
        flutter build apk --release

    - name: Rename APK
      run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Ajiputra-project-GPS.apk"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.name }}
        name: Ajiputra-project GPS Release ${{ steps.tag.outputs.name }}
        files: "build/app/outputs/flutter-apk/Ajiputra-project-GPS.apk"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
